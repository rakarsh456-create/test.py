<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWI Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="home-body">

    <div class="container">

        <div class="card">

            <h1>🔥 Fire Weather Index Prediction</h1>

            <p class="subtitle">
                Enter the weather parameters below to predict the Fire Weather Index.
            </p>

            <form action="{{ url_for('predict_datapoint') }}" method="POST">

                <div class="form-grid">

                    <div class="input-box">
                        <label>🌡 Temperature (°C)</label>
                        <input type="number" step="any" name="Temperature" required>
                    </div>

                    <div class="input-box">
                        <label>💧 Relative Humidity (%)</label>
                        <input type="number" step="any" name="RH" required>
                    </div>

                    <div class="input-box">
                        <label>🌬 Wind Speed</label>
                        <input type="number" step="any" name="Ws" required>
                    </div>

                    <div class="input-box">
                        <label>🌧 Rain (mm)</label>
                        <input type="number" step="any" name="Rain" required>
                    </div>

                    <div class="input-box">
                        <label>🔥 FFMC</label>
                        <input type="number" step="any" name="FFMC" required>
                    </div>

                    <div class="input-box">
                        <label>🌲 DMC</label>
                        <input type="number" step="any" name="DMC" required>
                    </div>

                    <div class="input-box">
                        <label>⚡ ISI</label>
                        <input type="number" step="any" name="ISI" required>
                    </div>

                    <div class="input-box">
                        <label>📊 Classes (0/1)</label>
                        <input type="number" name="Classes" required>
                    </div>

                    <div class="input-box full-width">
                        <label>📍 Region (0/1)</label>
                        <input type="number" name="Region" required>
                    </div>

                </div>

                <button type="submit" class="predict-btn">
                    Predict Fire Weather Index
                </button>

            </form>

            {% if results %}

            <div class="result-card">

                <h2>🔥 Prediction Result</h2>

                <div class="prediction-value">

                    {{ results }}

                </div>

            </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
